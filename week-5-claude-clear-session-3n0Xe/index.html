<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo1/600/400" alt="Gallery photo 1">
        <figcaption>Photo One</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo2/600/400" alt="Gallery photo 2">
        <figcaption>Photo Two</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo3/600/400" alt="Gallery photo 3">
        <figcaption>Photo Three</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo4/600/400" alt="Gallery photo 4">
        <figcaption>Photo Four</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo5/600/400" alt="Gallery photo 5">
        <figcaption>Photo Five</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo6/600/400" alt="Gallery photo 6">
        <figcaption>Photo Six</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo7/600/400" alt="Gallery photo 7">
        <figcaption>Photo Seven</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo8/600/400" alt="Gallery photo 8">
        <figcaption>Photo Eight</figcaption>
      </figure>

    </section>
  </main>

  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" aria-label="Previous">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" aria-label="Next">&#8250;</button>
    <p id="lightbox-caption"></p>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
