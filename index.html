<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Portfolio</h1>
  </header>

  <main>
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo1/600/400" alt="Golden coastline at sunset">
        <figcaption>Golden Coastline at Sunset</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo2/600/400" alt="Misty mountain peaks">
        <figcaption>Misty Mountain Peaks</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo3/600/400" alt="Urban geometry at dusk">
        <figcaption>Urban Geometry at Dusk</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo4/600/400" alt="Forest floor in autumn">
        <figcaption>Forest Floor in Autumn</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo5/600/400" alt="Quiet lake reflections">
        <figcaption>Quiet Lake Reflections</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo6/600/400" alt="Desert solitude">
        <figcaption>Desert Solitude</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo7/600/400" alt="City streets after rain">
        <figcaption>City Streets After Rain</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/seed/photo8/600/400" alt="Wild meadow in bloom">
        <figcaption>Wild Meadow in Bloom</figcaption>
      </figure>

    </section>
  </main>

  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">&times;</button>
    <button id="lightbox-prev" aria-label="Previous">&#8249;</button>
    <img id="lightbox-img" src="" alt="">
    <button id="lightbox-next" aria-label="Next">&#8250;</button>
    <p id="lightbox-caption"></p>
  </div>

  <script src="gallery.js"></script>
</body>
</html>
